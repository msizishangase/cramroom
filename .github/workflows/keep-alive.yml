name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 6 * * 1,4' # Mondays & Thursdays
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping staging project
        run: |
          curl -s "https://${REF}.supabase.co/rest/v1/" \
            -H "apikey: ${ANON_KEY}" > /dev/null
        env:
          REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
