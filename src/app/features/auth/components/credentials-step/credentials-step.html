<form [formGroup]="form" (ngSubmit)="onSubmit()" class="cr-form">
  <label class="cr-label" for="email">Email</label>
  <input
    class="cr-input"
    id="email"
    type="email"
    formControlName="email"
    placeholder="you@example.com"
    autocomplete="email"
  />
  @if (form.controls.email.invalid && form.controls.email.touched) {
    <p class="cr-error">Enter a valid email address.</p>
  }

  <label class="cr-label" for="password">Password</label>
  <div class="cr-input-wrapper">
    <input
      class="cr-input"
      id="password"
      [type]="showPassword() ? 'text' : 'password'"
      formControlName="password"
      placeholder="At least 8 characters"
      autocomplete="new-password"
    />
    <button type="button" class="cr-input-toggle" (click)="togglePasswordVisibility()">
      {{ showPassword() ? 'Hide' : 'Show' }}
    </button>
  </div>
  @if (form.controls.password.invalid && form.controls.password.touched) {
    <p class="cr-error">Password must be at least 8 characters.</p>
  }

  <button type="submit" class="cr-btn-primary" [disabled]="loading">
    {{ loading ? 'Creating account…' : 'Continue' }}
  </button>
</form>
